<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">

  <style>
    .drop {
      animation: rain 1s linear infinite;
    }

    .drop:nth-child(2) {
      animation-delay: 0.2s;
    }

    .drop:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes rain {
      0% {
        transform: translateY(0px);
        opacity: 1;
      }

      100% {
        transform: translateY(20px);
        opacity: 0;
      }
    }
  </style>

  <!-- cloud -->
  <ellipse cx="60" cy="45" rx="30" ry="18" fill="#d1d5db"></ellipse>
  <ellipse cx="40" cy="50" rx="20" ry="15" fill="#d1d5db"></ellipse>
  <ellipse cx="80" cy="50" rx="20" ry="15" fill="#d1d5db"></ellipse>

  <!-- rain -->
  <line class="drop" x1="45" y1="75" x2="45" y2="90" stroke="#38bdf8" stroke-width="4"></line>

  <line class="drop" x1="60" y1="75" x2="60" y2="90" stroke="#38bdf8" stroke-width="4"></line>

  <line class="drop" x1="75" y1="75" x2="75" y2="90" stroke="#38bdf8" stroke-width="4"></line>

</svg>